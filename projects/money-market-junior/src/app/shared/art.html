Original market illustrations — flat fills, ink outline, hard sticker shadow. -->
<svg
  [attr.data-art]="key()"
  viewBox="0 0 96 96"
  role="img"
  aria-hidden="true"
  focusable="false"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="mmj-hard" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#262B21" flood-opacity="0.2" />
    </filter>
  </defs>

  @switch (key()) {
    <!-- ------------------------------------------------ produce ---------- -->
    @case ('apple') {
      <g filter="url(#mmj-hard)">
        <path
          d="M48 30c-4-9-14-11-21-5-9 8-8 24 2 35 6 7 13 10 19 10s13-3 19-10c10-11 11-27 2-35-7-6-17-4-21 5z"
          fill="#E45C3F" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M48 30c0-8 3-14 9-18" fill="none" stroke="#262B21" stroke-width="2.5" stroke-linecap="round" />
        <path d="M53 20c6-7 15-7 19-3-3 6-12 10-19 3z" fill="#9DC0A5" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M34 46c-3 3-4 8-3 12" fill="none" stroke="#FBF5E9" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
      </g>
    }
    @case ('banana') {
      <g filter="url(#mmj-hard)">
        <path
          d="M18 30c2 22 16 38 40 40 8 1 14-2 16-6-2-2-6-2-10-4C46 54 36 44 33 28c0-4-2-7-5-7s-4 3-3 7c1 6 1 8-3 8s-5-3-4-8z"
          fill="#F7C64B" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M74 66c4 2 8 3 12 2" fill="none" stroke="#262B21" stroke-width="2.5" stroke-linecap="round" />
        <path d="M24 26l6 2" stroke="#262B21" stroke-width="2.5" stroke-linecap="round" />
        <path d="M36 42c6 10 16 18 28 22" fill="none" stroke="#E0A72E" stroke-width="2.5" stroke-linecap="round" />
      </g>
    }
    @case ('berries') {
      <g filter="url(#mmj-hard)">
        <path d="M50 22l7-9M50 22l-8-7" stroke="#262B21" stroke-width="2.5" stroke-linecap="round" />
        <g stroke="#262B21" stroke-width="2.5" stroke-linejoin="round">
          <path d="M30 34c-8 0-12 5-11 12 1 6 6 8 11 8s10-2 11-8c1-7-3-12-11-12z" fill="#E45C3F" />
          <path d="M66 34c-8 0-12 5-11 12 1 6 6 8 11 8s10-2 11-8c1-7-3-12-11-12z" fill="#E45C3F" />
        </g>
        <path d="M24 42h48l-7 34c-1 6-5 9-17 9s-16-3-17-9z" fill="#E5EEDD" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M31 48l5 30M40 48l4 30M48 48v30M56 48l-4 30M65 48l-4 30" stroke="#9DC0A5" stroke-width="2.5" stroke-linecap="round" />
        <path d="M48 24c-8 0-12 6-11 12 1 6 6 9 11 9s10-3 11-9c1-6-3-12-11-12z" fill="#C24830" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M48 26c-3-5-8-6-11-4 2 4 6 6 11 4zM48 26c3-5 8-6 11-4-2 4-6 6-11 4z" fill="#4E7A3A" stroke="#262B21" stroke-width="2" stroke-linejoin="round" />
        <g fill="#F7C64B">
          <circle cx="44" cy="36" r="1.7" /><circle cx="52" cy="35" r="1.7" /><circle cx="48" cy="42" r="1.7" />
          <circle cx="28" cy="46" r="1.7" /><circle cx="35" cy="47" r="1.7" />
          <circle cx="61" cy="46" r="1.7" /><circle cx="68" cy="47" r="1.7" />
        </g>
      </g>
    }
    @case ('roll') {
      <g filter="url(#mmj-hard)">
        <ellipse cx="48" cy="54" rx="30" ry="22" fill="#E0A72E" stroke="#262B21" stroke-width="2.5" />
        <path d="M28 44c4-8 12-12 20-12" fill="none" stroke="#F7C64B" stroke-width="5" stroke-linecap="round" />
        <path d="M40 62c5 3 12 3 17 0" fill="none" stroke="#C24830" stroke-width="2.5" stroke-linecap="round" />
      </g>
    }
    @case ('bun') {
      <g filter="url(#mmj-hard)">
        <circle cx="48" cy="52" r="27" fill="#E0A72E" stroke="#262B21" stroke-width="2.5" />
        <path d="M48 52m-18 0a18 18 0 1 0 36 0a18 18 0 1 0-36 0 M48 52m-11 0a11 11 0 1 0 22 0a11 11 0 1 0-22 0 M48 52m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0"
              fill="none" stroke="#A33A22" stroke-width="2.5" stroke-linecap="round" />
        <path d="M28 36c4-8 12-12 20-12" fill="none" stroke="#F7C64B" stroke-width="5" stroke-linecap="round" />
      </g>
    }
    @case ('lemonade') {
      <g filter="url(#mmj-hard)">
        <path d="M32 26h32l-5 52c-1 5-4 7-11 7s-10-2-11-7z" fill="#EAF3F5" opacity="0.95" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M33.5 44h29l-3.5 34c-1 5-4 7-11 7s-10-2-11-7z" fill="#7FB6C6" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <circle cx="48" cy="60" r="9" fill="#F7C64B" stroke="#262B21" stroke-width="2.5" />
        <path d="M48 51v18M39 60h18" stroke="#E0A72E" stroke-width="2" />
        <path d="M58 24c0-8 4-12 10-14" fill="none" stroke="#E45C3F" stroke-width="4" stroke-linecap="round" />
        <path d="M32 26h32" stroke="#262B21" stroke-width="2.5" stroke-linecap="round" />
      </g>
    }
    @case ('milk') {
      <g filter="url(#mmj-hard)">
        <path d="M30 34l18-10 18 10v42c0 5-3 7-8 7H38c-5 0-8-2-8-7z" fill="#FFFDF4" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M30 34l18-10 18 10-18 10z" fill="#9DC0A5" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M30 52h36v20c0 5-3 7-8 7H38c-5 0-8-2-8-7z" fill="#1E5B3E" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M40 62c4 3 12 3 16 0" fill="none" stroke="#FBF5E9" stroke-width="2.5" stroke-linecap="round" />
      </g>
    }
    @case ('crackers') {
      <g filter="url(#mmj-hard)">
        <rect x="20" y="34" width="30" height="30" rx="6" fill="#F7C64B" stroke="#262B21" stroke-width="2.5" transform="rotate(-6 35 49)" />
        <rect x="42" y="38" width="30" height="30" rx="6" fill="#E0A72E" stroke="#262B21" stroke-width="2.5" transform="rotate(5 57 53)" />
        <g fill="#262B21" opacity="0.55">
          <circle cx="30" cy="46" r="2" /><circle cx="40" cy="52" r="2" /><circle cx="30" cy="56" r="2" />
          <circle cx="54" cy="52" r="2" /><circle cx="64" cy="58" r="2" /><circle cx="58" cy="64" r="2" />
        </g>
        <path d="M36 72c8 4 18 4 26-2" fill="none" stroke="#262B21" stroke-width="2.5" stroke-linecap="round" />
      </g>
    }

    <!-- ------------------------------------------------ money ----------- -->
    @case ('coin-1') {
      <circle cx="48" cy="52" r="34" fill="#C98A4B" stroke="#262B21" stroke-width="2.5" filter="url(#mmj-hard)" />
      <circle cx="48" cy="52" r="26" fill="none" stroke="#A96F35" stroke-width="2.5" />
      <text x="48" y="62" text-anchor="middle" class="art-num" font-size="30" fill="#262B21">1</text>
    }
    @case ('coin-2') {
      <circle cx="48" cy="52" r="36" fill="#C98A4B" stroke="#262B21" stroke-width="2.5" filter="url(#mmj-hard)" />
      <circle cx="48" cy="52" r="28" fill="none" stroke="#A96F35" stroke-width="2.5" />
      <path d="M48 24c-2 6-2 8 0 10" fill="none" stroke="#262B21" stroke-width="2.5" stroke-linecap="round" />
      <text x="48" y="63" text-anchor="middle" class="art-num" font-size="32" fill="#262B21">2</text>
    }
    @case ('coin-5') {
      <circle cx="48" cy="52" r="37" fill="#F7C64B" stroke="#262B21" stroke-width="2.5" filter="url(#mmj-hard)" />
      <circle cx="48" cy="52" r="29" fill="none" stroke="#E0A72E" stroke-width="2.5" />
      <path d="M40 22c-4 4-3 8 0 10M56 22c4 4 3 8 0 10" fill="none" stroke="#262B21" stroke-width="2.5" stroke-linecap="round" />
      <text x="48" y="63" text-anchor="middle" class="art-num" font-size="32" fill="#262B21">5</text>
    }
    @case ('coin-10') {
      <circle cx="48" cy="52" r="38" fill="#F7C64B" stroke="#262B21" stroke-width="2.5" filter="url(#mmj-hard)" />
      <circle cx="48" cy="52" r="31" fill="#E0A72E" opacity="0.5" />
      <circle cx="48" cy="52" r="31" fill="none" stroke="#E0A72E" stroke-width="2.5" />
      <path d="M38 20c-5 4-4 9 0 11M58 20c5 4 4 9 0 11" fill="none" stroke="#262B21" stroke-width="2.5" stroke-linecap="round" />
      <text x="48" y="62" text-anchor="middle" class="art-num" font-size="28" fill="#262B21">10</text>
    }
    @case ('note-20') {
      <g filter="url(#mmj-hard)">
        <rect x="10" y="26" width="76" height="48" rx="9" fill="#1E5B3E" stroke="#262B21" stroke-width="2.5" />
        <rect x="16" y="32" width="64" height="36" rx="6" fill="none" stroke="#9DC0A5" stroke-width="2" stroke-dasharray="4 4" />
        <text x="48" y="59" text-anchor="middle" class="art-num" font-size="28" fill="#FBF5E9">20</text>
      </g>
    }

    <!-- ------------------------------------------------ UI icons -------- -->
    @case ('basket') {
      <g filter="url(#mmj-hard)">
        <path d="M18 38h60l-7 38c-1 6-5 8-23 8s-22-2-23-8z" fill="#E0A72E" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M34 50l3 26M48 50v26M62 50l-3 26M27 50h42" fill="none" stroke="#C24830" stroke-width="2.5" stroke-linecap="round" />
        <path d="M34 38c0-12 5-20 14-20s14 8 14 20" fill="none" stroke="#262B21" stroke-width="2.5" stroke-linecap="round" />
      </g>
    }
    @case ('tag') {
      <g filter="url(#mmj-hard)">
        <path d="M14 44c0-4 3-7 7-7h30l24 24-31 31-24-24z" fill="#F7C64B" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" transform="rotate(-8 48 52)" />
        <circle cx="30" cy="47" r="4" fill="#FBF5E9" stroke="#262B21" stroke-width="2.5" />
        <text x="55" y="66" text-anchor="middle" class="art-num" font-size="24" fill="#262B21" transform="rotate(-8 48 52)">12</text>
      </g>
    }
    @case ('awning') {
      <g filter="url(#mmj-hard)">
        <path d="M12 34h72v18c0 8-6 14-14 14H26c-8 0-14-6-14-14z" fill="#1E5B3E" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M12 34h72" stroke="#262B21" stroke-width="2.5" />
        <g stroke="#FBF5E9" stroke-width="7">
          <path d="M24 34v14M40 34v14M56 34v14M72 34v14" />
        </g>
        <g fill="#FBF5E9">
          <circle cx="20" cy="58" r="8" /><circle cx="36" cy="58" r="8" /><circle cx="52" cy="58" r="8" /><circle cx="68" cy="58" r="8" />
        </g>
        <g fill="none" stroke="#262B21" stroke-width="2.5">
          <circle cx="20" cy="58" r="8" /><circle cx="36" cy="58" r="8" /><circle cx="52" cy="58" r="8" /><circle cx="68" cy="58" r="8" />
        </g>
        <path d="M12 34c0-6 5-10 10-10h52c5 0 10 4 10 10" fill="#E45C3F" stroke="#262B21" stroke-width="2.5" stroke-linejoin="round" />
      </g>
    }
    @case ('check') {
      <path d="M20 52l18 18 38-40" fill="none" stroke="#1E5B3E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('arrow-up') {
      <g fill="none" stroke="#A33A22" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M48 78V22M26 44l22-22 22 22" />
      </g>
    }
    @case ('stamp') {
      <g transform="rotate(-10 48 50)">
        <rect x="12" y="28" width="72" height="44" rx="8" fill="none" stroke="#C24830" stroke-width="5" />
        <text x="48" y="59" text-anchor="middle" class="art-num" font-size="24" fill="#C24830">PAID</text>
      </g>
    }
    @default {
      <rect x="24" y="24" width="48" height="48" rx="10" fill="#F1E7D2" stroke="#262B21" stroke-width="2.5" />
      <text x="48" y="56" text-anchor="middle" font-size="20" fill="#5A614F">?</text>
    }
  }
</svg>
